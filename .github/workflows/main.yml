name: Build APK Windows (Release Version)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (API 33 yêu cầu JDK cao hơn 11 để ổn định)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Android SDK (Fix lỗi Unexpected input)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Đưa api-level và build-tools vào mục packages
          packages: "platforms;android-33 build-tools;33.0.2"
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      # 4. Enable long paths for Windows (Tránh lỗi đường dẫn quá dài)
      - name: Enable long paths
        run: |
          git config --system core.longpaths true
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
        shell: powershell

      # 5. Build APK
      - name: Build Debug APK
        shell: cmd
        run: |
          call gradlew.bat clean assembleDebug --stacktrace

      - name: Rename APK
        shell: pwsh
        run: |
          Move-Item app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/basibacity.apk

      # 6. Upload lên GitHub Release
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: success() # Chỉ chạy nếu build thành công
        with:
          files: app/build/outputs/apk/debug/basibacity.apk
          tag_name: build-${{ github.run_number }}
          name: Release Build v${{ github.run_number }}
          body: |
            Bản build mới nhất từ nhánh ${{ github.ref_name }}.
            Mã commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
