name: Build APK Windows (Release Version)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      # 4. Enable long paths for Windows
      - name: Enable long paths
        run: |
          git config --system core.longpaths true
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
        shell: powershell

      # 5. Build APK
      - name: Build Debug APK
        shell: cmd
        run: |
          call gradlew.bat assembleDebug --stacktrace

      # 5.1. Tìm file .so
      - name: Find native library
        shell: powershell
        run: |
          Write-Host "Searching for libAlyn_SAMPMOBILE.so..."

          $files = Get-ChildItem -Path . -Recurse -Filter "libAlyn_SAMPMOBILE.so"

          if ($files.Count -eq 0) {
              Write-Error "libAlyn_SAMPMOBILE.so not found!"
              exit 1
          }

          foreach ($file in $files) {
              Write-Host "FOUND: $($file.FullName)"
          }

      # 5.2. Copy .so vào thư mục release
      - name: Prepare Release Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release-files" | Out-Null

          # Copy APK
          Copy-Item "app/build/outputs/apk/debug/*.apk" "release-files/" -Force

          # Copy tất cả libAlyn_SAMPMOBILE.so tìm được
          $files = Get-ChildItem -Path . -Recurse -Filter "libAlyn_SAMPMOBILE.so"

          foreach ($file in $files) {
              $abi = $file.Directory.Name
              $outputName = "libAlyn_SAMPMOBILE-$abi.so"

              Copy-Item $file.FullName "release-files/$outputName" -Force

              Write-Host "Copied: $outputName"
          }

          Write-Host ""
          Write-Host "===== RELEASE FILES ====="
          Get-ChildItem "release-files"

      # 6. Upload APK + .so lên GitHub Release
      - name: Upload APK and SO to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            release-files/*.apk
            release-files/*.so
          tag_name: build-${{ github.run_number }}
          name: Debug Build v${{ github.run_number }}
          body: |
            Bản build mới nhất từ nhánh ${{ github.ref_name }}.

            Mã commit:
            ${{ github.sha }}

            Files:
            - APK Debug
            - libAlyn_SAMPMOBILE.so
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
